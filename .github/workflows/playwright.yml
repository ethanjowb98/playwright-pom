# Static checks, then the suite in parallel slices (api, e2e in 2 shards, stateful), then one merged
# Allure report + failure analysis. Every run except pull requests publishes the report, failing and
# skipped tests included, to GitHub Pages (gh-pages branch) with the history behind its trend charts.
# See docs/ARCHITECTURE.md#ci.
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Tests to run
        type: choice
        options: [all, api, e2e, smoke]
        default: all

permissions:
  contents: read

# bash with pipefail (a bare `run:` gets `bash -e` only), so a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    name: Lint, format, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-tests: ${{ steps.plan.outputs.run-tests }}
      publish: ${{ steps.plan.outputs.publish }}
      suite: ${{ steps.plan.outputs.suite }}
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what this run does
        id: plan
        env:
          # Fork and Dependabot pull requests get no repository secrets, so the suite could not log in.
          RUN_TESTS: >-
            ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]'
            && github.event.pull_request.head.repo.full_name == github.repository) }}
          # Every run except pull requests is published: main, the nightly, and manual runs of any branch
          # or suite. Pull requests keep their report as an artifact.
          PUBLISH: ${{ github.event_name != 'pull_request' }}
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          # The slices (run-tests names) this suite runs, all of which must upload results to publish.
          case "$SUITE" in
            api) slices='api stateful' ;;
            e2e) slices='e2e-1 e2e-2 stateful' ;;
            *) slices='api e2e-1 e2e-2 stateful' ;;
          esac
          {
            echo "run-tests=${RUN_TESTS}"
            echo "publish=${PUBLISH}"
            echo "suite=${SUITE}"
            echo "slices=${slices}"
          } >> "$GITHUB_OUTPUT"

      # Lints the workflow, not the composite actions under .github/actions (actionlint does not read those).
      - name: Lint workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: ./.github/actions/setup
      - run: npm run check

  # A new push to a pull request cancels its api and e2e jobs (groups exist only for pull requests),
  # never stateful: cancelled mid-order, it would leave basket or order data on the shared account.
  api:
    name: API tests
    needs: check
    if: >-
      ${{ needs.check.outputs.run-tests == 'true'
      && (!inputs.suite || contains(fromJSON('["all", "api", "smoke"]'), inputs.suite)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-api
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_USERNAME: ${{ secrets.QACLOUD_USERNAME }}
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          name: api
          args: --project=api ${{ inputs.suite == 'smoke' && '--grep @smoke' || '' }}

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    needs: check
    if: >-
      ${{ needs.check.outputs.run-tests == 'true'
      && (!inputs.suite || contains(fromJSON('["all", "e2e", "smoke"]'), inputs.suite)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-e2e-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_USERNAME: ${{ secrets.QACLOUD_USERNAME }}
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          name: e2e-${{ matrix.shard }}
          browsers: 'true'
          args: >-
            --project=e2e-chromium --shard=${{ matrix.shard }}/2
            ${{ inputs.suite == 'smoke' && '--grep @smoke' || '' }}

  # The basket is account-wide: @stateful tests (API and UI) run on one worker, and the account-wide
  # concurrency group keeps two runs (a PR and main, say) from using the basket at the same time.
  # GitHub keeps one waiting job per group: when a third run's job queues, the one already waiting is
  # cancelled, and that run neither reports nor publishes (re-run it).
  stateful:
    name: Stateful tests (basket, orders)
    needs: check
    if: ${{ needs.check.outputs.run-tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: qacloud-account-basket
      cancel-in-progress: false
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_USERNAME: ${{ secrets.QACLOUD_USERNAME }}
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          name: stateful
          browsers: 'true'
          args: >-
            --project=stateful
            ${{ inputs.suite && inputs.suite != 'all' && format('--grep @{0}', inputs.suite) || '' }}

  # Pull requests (not published): read-only token.
  report:
    name: Allure report & failure analysis
    needs: [check, api, e2e, stateful]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.run-tests == 'true'
      && needs.check.outputs.publish != 'true' && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the sticky analysis comment
    env:
      # Masked in the analysis. The api key never reaches the results: SecretGuard checked each job.
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/report

      - name: Write the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "**Allure report:** the \`allure-report\` artifact of [this run](${RUN_URL})"
            echo
            if [ -f failure-analysis.md ]; then cat failure-analysis.md; else echo 'No failure analysis: see the log.'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, edited on every run.
      - name: Comment the analysis on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # A comment holds at most 65536 characters.
          MAX_CHARS: 60000
        run: |
          marker='<!-- failure-analysis -->'
          analysis=failure-analysis.md
          {
            echo "$marker"
            echo "**Test run [#${GITHUB_RUN_NUMBER}](${RUN_URL})** · Allure report: the \`allure-report\` artifact"
            echo
            if [ ! -f "$analysis" ]; then
              echo 'No failure analysis: see the run log.'
            elif [ "$(wc -c < "$analysis")" -le "$MAX_CHARS" ]; then
              cat "$analysis"
            else
              # Cut at a line boundary, never inside a character or a table row.
              head -c "$MAX_CHARS" "$analysis" | sed '$d'
              echo
              echo "_Truncated: the full analysis is in the [job summary](${RUN_URL})._"
            fi
          } > "$RUNNER_TEMP/comment.md"
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          fi

  # Every run except pull requests: the report goes to GitHub Pages with its history.
  publish:
    name: Allure report & failure analysis (publish)
    needs: [check, api, e2e, stateful]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.publish == 'true'
      && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the report site to gh-pages
    # Takes turns on gh-pages: each run reads the history, adds itself and pushes. As with stateful,
    # GitHub keeps one waiting job per group: a third run arriving cancels the one already waiting,
    # which is then never published (re-run it).
    concurrency:
      group: report-site
      cancel-in-progress: false
    env:
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # The repository variable REPORT_SITE_URL overrides the default <owner>.github.io/<repo> (a custom domain).
      - name: Resolve the report URL
        env:
          REPORT_SITE_URL: ${{ vars.REPORT_SITE_URL }}
        run: |
          site="${REPORT_SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          site="${site%/}"
          {
            echo "SITE_URL=${site}/"
            echo "REPORT_URL=${site}/runs/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}/"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/report
        with:
          report-url: ${{ env.REPORT_URL }}
          # Every slice this suite runs: a report with a slice missing is never published.
          expected-slices: ${{ needs.check.outputs.slices }}

      # Runs only when every step above succeeded: a missing slice, a missing history or a stale analysis
      # is never published.
      # One commit replaces the branch, so earlier commits (and their reports) are no longer referenced.
      - name: Publish to GitHub Pages
        id: publish
        env:
          SUITE: ${{ needs.check.outputs.suite }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npm run report:site -- publish --site "$SITE"
          # The site is its own work tree, with a separate index, so the repo checkout is untouched.
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$SITE" GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages.index"
          cd "$SITE"
          git add --all
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -m "Report for run ${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}")"
          # Refuses, instead of overwriting, when gh-pages moved since it was fetched (or appeared, when
          # it did not exist yet).
          git push --force-with-lease="refs/heads/gh-pages:${SITE_SHA}" origin "${commit}:refs/heads/gh-pages"

      - name: Write the job summary
        if: ${{ !cancelled() }}
        env:
          # `kept` is false when a re-run of an old run sorts outside the newest 20 and is dropped at once.
          PUBLISHED: ${{ steps.publish.outcome == 'success' && steps.publish.outputs.kept == 'true' }}
        run: |
          {
            if [ "$PUBLISHED" = 'true' ]; then
              echo "**Allure report:** ${REPORT_URL} · [all runs](${SITE_URL})"
            else
              echo "**Allure report:** not published (see the log); the \`allure-report\` artifact of [this run](${RUN_URL})"
            fi
            echo
            if [ -f failure-analysis.md ]; then cat failure-analysis.md; else echo 'No failure analysis: see the log.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
