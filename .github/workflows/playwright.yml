# Static checks, then the suite in parallel slices (api, e2e in 2 shards, stateful), then one merged
# Allure report + failure analysis. Runs outside pull requests publish the report to GitHub Pages
# (gh-pages branch) with the history behind its trend charts. See docs/ARCHITECTURE.md#ci.
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Tests to run
        type: choice
        options: [all, api, e2e, smoke]
        default: all

# A new push to a pull request supersedes its running checks. Other runs are never cancelled: they
# publish the report, and a cancelled run can leave seeded data behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report-url: ${{ steps.site.outputs.report-url }}
      site-url: ${{ steps.site.outputs.site-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check

      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      # Where this run's report will be published (none for pull requests). The repository variable
      # REPORT_SITE_URL overrides the default <owner>.github.io/<repo> (a custom Pages domain).
      - name: Resolve the report URL
        id: site
        if: github.event_name != 'pull_request'
        env:
          REPORT_SITE_URL: ${{ vars.REPORT_SITE_URL }}
        run: |
          site="${REPORT_SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          site="${site%/}"
          echo "site-url=${site}/" >> "$GITHUB_OUTPUT"
          echo "report-url=${site}/runs/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}/" >> "$GITHUB_OUTPUT"

  api:
    name: API tests
    needs: check
    if: ${{ !inputs.suite || contains(fromJSON('["all", "api", "smoke"]'), inputs.suite) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_USERNAME: ${{ secrets.QACLOUD_USERNAME }}
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
      ALLURE_REPORT_URL: ${{ needs.check.outputs.report-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          name: api
          args: --project=api ${{ inputs.suite == 'smoke' && '--grep @smoke' || '' }}

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    needs: check
    if: ${{ !inputs.suite || contains(fromJSON('["all", "e2e", "smoke"]'), inputs.suite) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_USERNAME: ${{ secrets.QACLOUD_USERNAME }}
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
      ALLURE_REPORT_URL: ${{ needs.check.outputs.report-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          name: e2e-${{ matrix.shard }}
          browsers: 'true'
          args: >-
            --project=e2e-chromium --shard=${{ matrix.shard }}/2
            ${{ inputs.suite == 'smoke' && '--grep @smoke' || '' }}

  # The basket is account-wide: @stateful tests (API and UI) run on one worker, and the account-wide
  # concurrency group keeps two runs (a PR and main, say) from using the basket at the same time.
  stateful:
    name: Stateful tests (basket, orders)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: qacloud-account-basket
      cancel-in-progress: false
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_USERNAME: ${{ secrets.QACLOUD_USERNAME }}
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
      ALLURE_REPORT_URL: ${{ needs.check.outputs.report-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          name: stateful
          browsers: 'true'
          args: >-
            --project=stateful
            ${{ inputs.suite && inputs.suite != 'all' && format('--grep @{0}', inputs.suite) || '' }}

  report:
    name: Allure report & failure analysis
    needs: [check, api, e2e, stateful]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the report site to gh-pages
      pull-requests: write # the sticky analysis comment
    # Runs that publish take turns on gh-pages: each reads the history, adds itself and pushes.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('report-{0}', github.ref) || 'report-site' }}
      cancel-in-progress: false
    env:
      # Masked in the analysis. The api key never reaches the results: SecretGuard checked each job.
      QACLOUD_PASSWORD: ${{ secrets.QACLOUD_PASSWORD }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      REPORT_URL: ${{ needs.check.outputs.report-url }}
      SITE_URL: ${{ needs.check.outputs.site-url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Merge the Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Every slice wrote the same run info except its shard.
      - name: Drop the per-slice shard from the environment
        run: |
          if [ -f allure-results/environment.properties ]; then
            sed -i '/^Shard=/d' allure-results/environment.properties
          fi

      # The site branch is read on every run (trend and baseline), but written only by runs that publish.
      - name: Fetch the report site
        run: |
          SITE="$RUNNER_TEMP/gh-pages"
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          mkdir -p "$SITE"
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C "$SITE"
          else
            echo "No gh-pages branch yet: this run starts the site."
          fi
          npm run report:site -- restore --site "$SITE"

      - name: Analyse failures
        run: npm run analyze

      - name: Generate the Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload the Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      # One commit replaces the branch each time, so old reports leave the repository with the site.
      - name: Publish to GitHub Pages
        if: ${{ !cancelled() && env.PUBLISH == 'true' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npm run report:site -- publish --site "$SITE"
          # The site is its own work tree, with a separate index, so the repo checkout is untouched.
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$SITE" GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages.index"
          cd "$SITE"
          git add --all
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -m "Report for run ${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}")"
          git push --force origin "${commit}:refs/heads/gh-pages"

      - name: Write the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            if [ "$PUBLISH" = 'true' ]; then
              echo "**Allure report:** ${REPORT_URL} · [all runs](${SITE_URL})"
            else
              echo "**Allure report:** the \`allure-report\` artifact of [this run](${RUN_URL})"
            fi
            echo
            if [ -f failure-analysis.md ]; then cat failure-analysis.md; else echo 'No failure analysis: see the log.'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, edited on every run. Fork PRs get no token to write it.
      - name: Comment the analysis on the pull request
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- failure-analysis -->'
          {
            echo "$marker"
            echo "**Test run [#${GITHUB_RUN_NUMBER}](${RUN_URL})** · Allure report: the \`allure-report\` artifact"
            echo
            # A comment holds at most 65536 characters.
            if [ -f failure-analysis.md ]; then head -c 60000 failure-analysis.md; else echo 'No failure analysis: see the run log.'; fi
          } > "$RUNNER_TEMP/comment.md"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          fi
