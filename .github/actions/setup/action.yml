name: Set up the suite
description: Node with the npm cache, npm ci, and (optionally) Chromium from the Playwright browser cache.

inputs:
  browsers:
    description: Install Chromium for the UI projects.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - run: npm ci
      shell: bash

    # Keyed on the installed Playwright version: a Playwright bump downloads the matching browser.
    - name: Read the Playwright version
      if: inputs.browsers == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      if: inputs.browsers == 'true'
      id: browser-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Chromium
      if: inputs.browsers == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # Saved right after the install, not at job end: actions/cache skips saving when the job fails,
    # and a red test run would leave the cache empty.
    - name: Save Playwright browsers
      if: inputs.browsers == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}

    # The cache holds the browser only; its system libraries still need installing.
    - name: Install Chromium system dependencies
      if: inputs.browsers == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
